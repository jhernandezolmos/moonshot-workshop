# Publishes the scroll presentation with GitLab Pages.
# The job must be named "pages". It publishes a folder named public.
#
# The runner cannot reach the npm registry reliably, so this job does not
# install or build. The compiled site is committed in site/, and the clips
# stay in public/media. Rebuild site/ locally with `npm run build` after
# changing the app, then copy dist/index.html and dist/assets into site/.

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p out
    - cp -a site/. out/
    - mkdir -p out/media out/brand
    - cp -a public/media/. out/media/
    - cp -a public/brand/. out/brand/
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
